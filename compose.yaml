# Full deployment stack (apps + infra) — the file Dokploy points at.
# Apps build from per-app Dockerfiles (context = repo ROOT). For LOCAL DEV infra only
# (Postgres/Redis/MinIO without the apps), use infra/compose.dev.yaml instead.
#
# All config/secrets come from the Dokploy dashboard (Environment tab) and are referenced
# below via ${VAR}. Set them per each app's .env.example. See DEPLOYMENT.md for the full
# runbook. The internal service-to-service wiring (DB/Redis/S3/AGENT_ORIGIN) is fixed here.
name: aqsha

# Shared by api + worker + agent (they all run @aqsha/services in-process: datastore,
# object storage, Clerk verify, embeddings, research resolvers).
x-backend-env: &backend-env
  DATABASE_URL: postgresql://aqsha:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/aqsha
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  # PUBLIC https URL of MinIO (e.g. https://s3.example.com) — presigned upload/download URLs
  # inherit this host, so it MUST be browser-reachable (not the internal minio:9000).
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT to the public MinIO URL}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${MINIO_BUCKET:-aqsha}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
  AQSHA_EMBEDDING_API_KEY: ${AQSHA_EMBEDDING_API_KEY:?set AQSHA_EMBEDDING_API_KEY}
  AQSHA_EMBEDDING_BASE_URL: ${AQSHA_EMBEDDING_BASE_URL:-}
  AQSHA_RAG_EMBEDDING_MODEL: ${AQSHA_RAG_EMBEDDING_MODEL:-text-embedding-3-small}
  AQSHA_RAG_EMBEDDING_DIMENSION: ${AQSHA_RAG_EMBEDDING_DIMENSION:-1536}
  OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
  JINA_API_KEY: ${JINA_API_KEY:-}
  UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
  AQSHA_CONTACT_EMAIL: ${AQSHA_CONTACT_EMAIL:-}
  SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      # web proxies /eve/v1/* to the agent container (internal network).
      AGENT_ORIGIN: http://agent:4317
    expose:
      - "3000"
    depends_on: [api, agent]

  api:
    image: aqsha-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: &api-env
      <<: *backend-env
      PORT: "3001"
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET}
      AQSHA_FAST_MODEL_API_KEY: ${AQSHA_FAST_MODEL_API_KEY:?set AQSHA_FAST_MODEL_API_KEY}
      AQSHA_FAST_MODEL_BASE_URL: ${AQSHA_FAST_MODEL_BASE_URL:-}
      AQSHA_FAST_MODEL: ${AQSHA_FAST_MODEL:-gpt-4o-mini}
      MAYAR_SERVER: ${MAYAR_SERVER:-sandbox}
      MAYAR_API_KEY: ${MAYAR_API_KEY:?set MAYAR_API_KEY}
      MAYAR_WEBHOOK_SECRET: ${MAYAR_WEBHOOK_SECRET:?set MAYAR_WEBHOOK_SECRET}
      MAYAR_STARTER_MONTHLY_PRODUCT_ID: ${MAYAR_STARTER_MONTHLY_PRODUCT_ID:-}
      MAYAR_STARTER_YEARLY_PRODUCT_ID: ${MAYAR_STARTER_YEARLY_PRODUCT_ID:-}
      MAYAR_PLUS_MONTHLY_PRODUCT_ID: ${MAYAR_PLUS_MONTHLY_PRODUCT_ID:-}
      MAYAR_PLUS_YEARLY_PRODUCT_ID: ${MAYAR_PLUS_YEARLY_PRODUCT_ID:-}
      MAYAR_ULTRA_MONTHLY_PRODUCT_ID: ${MAYAR_ULTRA_MONTHLY_PRODUCT_ID:-}
      MAYAR_ULTRA_YEARLY_PRODUCT_ID: ${MAYAR_ULTRA_YEARLY_PRODUCT_ID:-}
      LLM_METADATA_ENABLED: ${LLM_METADATA_ENABLED:-false}
      AQSHA_ADMIN_OWNER_USER_IDS: ${AQSHA_ADMIN_OWNER_USER_IDS:-}
      AQSHA_ADMIN_EMAILS: ${AQSHA_ADMIN_EMAILS:-}
    expose:
      - "3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  # Reuses the api image (built above) with the worker entrypoint + the same env.
  worker:
    image: aqsha-api
    restart: unless-stopped
    command: ["bun", "run", "start:worker"]
    environment:
      <<: *api-env
    depends_on:
      api: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: "4317"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AQSHA_LITE_MODEL: ${AQSHA_LITE_MODEL:-gpt-4o}
      AQSHA_LITE_CONTEXT_WINDOW: ${AQSHA_LITE_CONTEXT_WINDOW:-128000}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
    volumes:
      # eve durable run state — file-backed; MUST persist across restarts (single replica).
      - agent_workflow_data:/app/apps/agent/.workflow-data
    expose:
      - "4317"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqsha
      POSTGRES_USER: aqsha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # DB management (Drizzle Studio / psql) over Tailscale. Default 127.0.0.1 = not exposed;
    # set POSTGRES_BIND_IP to the VPS Tailscale IP in Dokploy to reach it from a Tailscale peer.
    # Host port 5435: 5432 = aqsha dev DB, 5433 = minchat, 5434 = telewave already use these on
    # this VPS. Verify free before changing: `ss -ltn | grep :<port>` on the host.
    # ponytail: never bind 0.0.0.0 here — that publishes the DB to the internet.
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqsha"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket create (idempotent), then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-aqsha}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      echo 'bucket siap: '$${MINIO_BUCKET};
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  agent_workflow_data:
