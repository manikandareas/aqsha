# Full deployment stack (apps + infra) — the file Dokploy points at.
#
# The app images (web/api/agent) are BUILT IN CI (GitHub Actions) and pushed to GHCR; here they
# are only `image: ghcr.io/manikandareas/aqsha-*:${IMAGE_TAG:-latest}` — Dokploy just pulls and
# restarts (near-zero CPU, no `next build`/`mastra build` on the VPS). See .github/workflows/.
# For a LOCAL emergency build (no CI), overlay compose.build.yaml which re-adds the `build:` blocks:
#   docker compose -f compose.yaml -f compose.build.yaml build
# For LOCAL DEV infra only (Postgres/Redis/MinIO without the apps), use infra/compose.dev.yaml.
#
# IMAGE_TAG selects the image version to run (default `latest`; set a `sha-<short>` in Dokploy to
# pin/roll back). GHCR is private → add a `read:packages` PAT under Dokploy → Settings → Registry.
#
# All config/secrets come from the Dokploy dashboard (Environment tab) and are referenced
# below via ${VAR}. Set them per each app's .env.example. See DEPLOYMENT.md for the full
# runbook. The internal service-to-service wiring (DB/Redis/S3/AGENT_ORIGIN) is fixed here.
#
# ONE file, TWO stacks: prod (branch main, defaults below) and staging (branch development,
# Dokploy env tab sets AQSHA_PROJECT_NAME=aqsha-staging + POSTGRES_HOST_PORT=5436 +
# IMAGE_TAG=staging + INFISICAL_ENV=staging). The project name prefixes every volume and the
# default network, so the two stacks share nothing. See DEPLOYMENT.md → Staging.
name: ${AQSHA_PROJECT_NAME:-aqsha}

# Runtime secrets/config for the app services (web/api/worker/agent/migrate) DO NOT live here anymore.
# They are stored in Infisical (project aqsha, folder /app) and injected at container start by the
# image entrypoint (`infisical run`, see infra/infisical-entrypoint.sh) — DATABASE_URL, REDIS_URL,
# S3_*, CLERK_*, OPENAI_*, MAYAR_*, SENTRY_DSN_*, LANGFUSE_*, etc. Change a value in Infisical, restart
# the service, done — no compose/Dokploy edit. `SENTRY_RELEASE`/`GIT_COMMIT` stay baked into each image
# at build (Dockerfile ARG) — never set them here.
#
# Only these five bootstrap vars reach the app via the Dokploy Environment tab; the CLI trades the
# machine-identity id/secret for a token and pulls INFISICAL_ENV's secrets. Left empty (local
# `compose.build.yaml` build / no Infisical), the entrypoint execs the app directly on ambient env.
# Stock images (postgres/redis/minio/alloy) can't run the CLI → their creds stay as ${VAR} below,
# from the Dokploy env (see .env.example → section "di Dokploy").
x-infisical-bootstrap: &infisical-bootstrap
  INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
  INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
  INFISICAL_API_URL: ${INFISICAL_API_URL:-https://secrets.aqshara.com}
  INFISICAL_ENV: ${INFISICAL_ENV:-prod}

services:
  web:
    # Built in CI (NEXT_PUBLIC_* baked at build from Infisical /build). Local build: compose.build.yaml.
    image: ghcr.io/manikandareas/aqsha-web:${IMAGE_TAG:-latest}
    # Dokploy deploys with `docker compose up -d` (no `pull`); a mutable tag like `latest` would
    # otherwise keep running the stale local image forever. Applies to every GHCR app image below.
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *infisical-bootstrap
      # web proxies /mastra-api/* to the Mastra agent container — fixed internal wiring, not a secret.
      # PORT/HOSTNAME are baked in the image; CLERK_SECRET_KEY + SENTRY_DSN_WEB come from Infisical /app.
      MASTRA_AGENT_ORIGIN: http://agent:4317
    expose:
      - "3000"
    depends_on: [api, agent]

  api:
    # Built in CI, pushed to GHCR; the worker service reuses this exact image (same ref below).
    image: ghcr.io/manikandareas/aqsha-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: &app-env
      <<: *infisical-bootstrap
      PORT: "3001"
      # api + worker share ONE image + Sentry project; AQSHA_PROCESS (the Sentry `process` tag) is the
      # only per-service difference and is not a secret, so it's set here. worker overrides it below.
      # Everything else (CLERK/MAYAR/FAST_MODEL/MISTRAL/SENTRY_DSN_API/…) comes from Infisical /app.
      AQSHA_PROCESS: api
    expose:
      - "3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  # Reuses the api image with the worker entrypoint + the same env (AQSHA_PROCESS overridden so
  # Sentry tags worker errors distinctly within the shared api project).
  worker:
    image: ghcr.io/manikandareas/aqsha-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    command: ["bun", "run", "start:worker"]
    environment:
      <<: *app-env
      AQSHA_PROCESS: worker
    depends_on:
      api: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  agent:
    # Built in CI (mastra build), pushed to GHCR. Local build: compose.build.yaml.
    image: ghcr.io/manikandareas/aqsha-agent:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # PORT/HOST/NODE_ENV are baked in the image. Everything else — CLERK_PUBLISHABLE_KEY (Mastra
      # server.auth JWKS), model knobs (AQSHA_PRO_MODEL/*_CONTEXT_WINDOW/*_REASONING_EFFORT), LANGFUSE_*,
      # SENTRY_DSN_AGENT, AQSHA_OTLP_TRACES_ENDPOINT, AQSHA_OBSERVABILITY — comes from Infisical /app.
      <<: *infisical-bootstrap
    # Mastra runtime state lives in Postgres (mastra_* tables) — no file-backed durable volume.
    expose:
      - "4317"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  # One-shot DB migration (Drizzle). NOT part of a normal `up` — it sits behind the `migrate`
  # profile, run explicitly from the Dokploy terminal / host after a deploy that ships a new
  # migration (replaces the manual `bun run db:migrate`, DEPLOYMENT.md Step 5):
  #   docker compose --profile migrate run --rm migrate
  # Reuses the api image + the internal DATABASE_URL, then exits. Kept manual (never auto-on-boot)
  # so several app containers starting at once can't race the same migration.
  migrate:
    image: ghcr.io/manikandareas/aqsha-api:${IMAGE_TAG:-latest}
    pull_policy: always
    profiles: ["migrate"]
    command: ["bun", "run", "db:migrate"]
    environment:
      # DATABASE_URL comes from Infisical /app (via the entrypoint) just like the app services.
      <<: *infisical-bootstrap
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqsha
      POSTGRES_USER: aqsha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # DB management (Drizzle Studio / psql) over Tailscale. Default 127.0.0.1 = not exposed;
    # set POSTGRES_BIND_IP to the VPS Tailscale IP in Dokploy to reach it from a Tailscale peer.
    # Host port map on this VPS: 5432 = aqsha dev DB, 5433 = minchat, 5434 = telewave,
    # 5435 = aqsha prod (default), 5436 = aqsha staging (set POSTGRES_HOST_PORT in that stack).
    # Verify free before changing: `ss -ltn | grep :<port>` on the host.
    # ponytail: never bind 0.0.0.0 here — that publishes the DB to the internet.
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqsha"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket create (idempotent), then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-aqsha}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      echo 'bucket siap: '$${MINIO_BUCKET};
      "
    restart: "no"

  # Grafana Alloy — the single observability collector for the whole stack: container logs → Loki,
  # host + container metrics → Prometheus/Mimir, and the agent's OTLP traces → Tempo (all Grafana
  # Cloud, free tier). OPT-IN behind the `observability` profile: it runs only when `observability`
  # is in COMPOSE_PROFILES (set that in the Dokploy Environment tab). Config: infra/alloy/config.alloy.
  # Creds/endpoints: the GRAFANA_CLOUD_* env below (see .env.example + DEPLOYMENT.md). With the
  # profile off there is zero overhead; with it on but creds empty, Alloy may crash-loop — fill all
  # three endpoints together (one Grafana Cloud account provides Loki + Prometheus + Tempo).
  alloy:
    image: grafana/alloy:v1.17.1
    profiles: ["observability"]
    restart: unless-stopped
    # cAdvisor (per-container metrics) needs privileged + the host mounts below to read container
    # cgroups on a Linux Docker host (per Grafana's prometheus.exporter.cadvisor recipe). Standard
    # for a monitoring collector on a single-owner VPS. Drop `privileged` + the cadvisor exporter in
    # config.alloy if you only want logs + host metrics + traces (those don't need it).
    privileged: true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_TEMPO_URL: ${GRAFANA_CLOUD_TEMPO_URL:-}
      GRAFANA_CLOUD_TEMPO_USER: ${GRAFANA_CLOUD_TEMPO_USER:-}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:-}
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # docker.sock (log discovery + cAdvisor docker_host) lives under /var/run. rw per Grafana's
      # cAdvisor recipe (immaterial next to `privileged`, but matches the documented-working mount).
      - /var/run:/var/run:rw
      # cAdvisor container stats + prometheus.exporter.unix host rootfs/sys (paths set in config.alloy).
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # Host /proc for the node exporter, mounted separately so the container keeps its own /proc.
      - /proc:/host/proc:ro
    expose:
      - "4318"  # OTLP HTTP receiver — agent pushes traces here (internal only, no domain).

volumes:
  postgres_data:
  redis_data:
  minio_data:
  alloy_data:
