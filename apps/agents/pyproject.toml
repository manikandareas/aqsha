[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aqsha-astra-agents"
version = "0.1.0"
description = "Astra multi-agent boilerplate for Aqsha using Pydantic AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124.0",
  "pydantic-ai>=1.0.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.407",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
observability = [
  "logfire>=4.0.0",
]

[project.scripts]
astra = "astra.cli:main"
astra-server = "astra.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnusedFunction = false
