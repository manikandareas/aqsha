[project]
name = "deep_research_agent"
version = "0.1.0"
description = "Deep research agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "ag-ui-protocol>=0.1.18",
    "colorama>=0.4.6",
    "crewai[google-genai,tools]>= 1.11.0",
    "fastapi>=0.136.1",
    "mcp>=1.23.3",
    "pytest>=8.4.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.46.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
kickoff = "deep_research_agent.main:kickoff"
run_crew = "deep_research_agent.main:kickoff"
plot = "deep_research_agent.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
