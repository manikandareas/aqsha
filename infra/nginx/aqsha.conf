# Aqsha V2 reverse proxy (Phase 10 cutover).
# Two upstreams on the same VPS host:
#   api.aqsha.app -> api-v2 (Bun/Elysia)  127.0.0.1:3001  — REST + /webhooks/clerk|polar + bull-board
#   app.aqsha.app -> web-v2 (Next + eve)  127.0.0.1:3000  — UI + eve NDJSON stream under /eve/v1/*
#
# Stream-safe block (D2) is applied to BOTH server blocks: the eve NDJSON stream
# rides on app.aqsha.app, and api keeps long-lived requests safe too. Without
# `proxy_buffering off` nginx buffers the whole response and the live token stream stalls.
#
# TLS: run `certbot --nginx -d api.aqsha.app -d app.aqsha.app` — it injects the
# ssl_certificate lines and the :80 redirect. The placeholders below let `nginx -t`
# pass before certs exist; certbot rewrites them.

# --- shared stream-safe proxy settings (used in each location) ---
# proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_read_timeout 3600s;

server {
    listen 80;
    listen [::]:80;
    server_name api.aqsha.app app.aqsha.app;
    # certbot replaces this with a 301 -> https. Until then, proxy plain http.
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aqsha.app;

    # ssl_certificate     /etc/letsencrypt/live/api.aqsha.app/fullchain.pem;  # certbot
    # ssl_certificate_key /etc/letsencrypt/live/api.aqsha.app/privkey.pem;    # certbot

    client_max_body_size 50m;  # artifact uploads go direct to S3/MinIO, but headroom for JSON bodies

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.aqsha.app;

    # ssl_certificate     /etc/letsencrypt/live/app.aqsha.app/fullchain.pem;  # certbot
    # ssl_certificate_key /etc/letsencrypt/live/app.aqsha.app/privkey.pem;    # certbot

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;       # D2: eve NDJSON stream must not be buffered
        proxy_read_timeout 3600s;  # long-lived chat / deep-research streams
    }
}
