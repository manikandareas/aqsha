# Dijalankan DI VPS. api-v2/web-v2 (lokal saat dev, atau proses host saat prod)
# menjangkau Postgres+Redis lewat Tailscale hostname/IP. Tidak ada api/web/minio di sini
# (R2 = layanan cloud; api-v2/web-v2 = proses host/systemd).
#
# Ganti 100.x.y.z dengan Tailscale IP VPS supaya port TIDAK terekspos ke internet publik.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqsha
      POSTGRES_USER: aqsha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    ports:
      # Bind ke IP Tailscale VPS (BIND_HOST di infra/.env). Default loopback supaya
      # tak pernah terekspos publik kalau BIND_HOST lupa diisi.
      - "${BIND_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqsha"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
