# Infra LOKAL untuk dev: Postgres(pgvector) + Redis + MinIO. Apps (api/web/agent) TIDAK di sini —
# jalankan terpisah dengan `bun dev`. Untuk deploy penuh (apps + infra) pakai root `compose.yaml`
# (dipakai Dokploy). MinIO = object storage S3-compatible.
#
# Port default bind ke 127.0.0.1 (BIND_HOST di infra/.env) supaya tak terekspos publik.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqsha
      POSTGRES_USER: aqsha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    ports:
      # Bind ke IP Tailscale VPS (BIND_HOST di infra/.env). Default loopback supaya
      # tak pernah terekspos publik kalau BIND_HOST lupa diisi.
      - "${BIND_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqsha"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # :latest demi simpel; pin ke tag RELEASE.* untuk produksi reproducible.
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # 9000 = S3 API (api + presigned upload browser). 9001 = console web.
      - "${BIND_HOST:-127.0.0.1}:9000:9000"
      - "${BIND_HOST:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: tunggu MinIO siap (until-loop, tahan-banting tanpa gantung healthcheck)
  # lalu bikin bucket. Idempotent (--ignore-existing); exit setelah selesai.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'menunggu MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      echo 'bucket siap: '$${MINIO_BUCKET};
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
