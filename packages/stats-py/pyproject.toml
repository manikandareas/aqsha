[project]
name = "aqsha-stats"
version = "0.1.0"
description = "Deterministic statistics engine for Aqsha (SPSS-parity, skripsi rituals)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pingouin>=0.5.5",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "python-docx>=1.2.0",
    "semopy>=2.3.11",
]

[dependency-groups]
dev = ["pytest>=8"]
sandbox = [
    "openpls-engine>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aqsha_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]
