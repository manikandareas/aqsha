name: Research Sandbox Image

on:
  push:
    branches:
      - main
      - development
    paths:
      - ".docker/research-sandbox.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/research-sandbox-image.yml"
      - "apps/api/skills/**"
      - "apps/api/package.json"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/research-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/research-sandbox.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
