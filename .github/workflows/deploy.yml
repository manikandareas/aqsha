name: Deploy public landing

# `main` serves only the public acquisition surface. Product code remains in the repository but
# its web, agent, and worker processes are intentionally absent from compose.public.yaml.
on:
  push:
    branches: [main, staging]
  workflow_dispatch: {}

concurrency:
  group: deploy-public-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  INFISICAL_ENV: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}

jobs:
  check:
    uses: ./.github/workflows/public-check.yml

  build:
    needs: check
    if: contains(fromJSON('["refs/heads/main", "refs/heads/staging"]'), github.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: www, dockerfile: apps/www/Dockerfile }
          - { name: api, dockerfile: apps/api/Dockerfile }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import public build configuration
        if: matrix.name == 'www'
        uses: ./.github/actions/infisical-import
        with:
          client-id: ${{ secrets.INFISICAL_PUBLIC_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_PUBLIC_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PUBLIC_PROJECT_SLUG }}
          secret-path: /build
          env-slug: ${{ env.INFISICAL_ENV }}

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aqsha-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=sha-,format=short,suffix=-staging,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=public-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=public-${{ matrix.name }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            PUBLIC_SITE_URL=${{ env.PUBLIC_SITE_URL }}
            PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
            PUBLIC_SENTRY_DSN=${{ env.PUBLIC_SENTRY_DSN }}
            PUBLIC_SENTRY_ENVIRONMENT=${{ env.PUBLIC_SENTRY_ENVIRONMENT }}
            SENTRY_ORG=${{ env.SENTRY_ORG }}
            SENTRY_PROJECT_WWW=${{ env.SENTRY_PROJECT_WWW }}
          secrets: |
            sentry_auth_token=${{ env.SENTRY_AUTH_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Import public deploy credentials
        uses: ./.github/actions/infisical-import
        with:
          client-id: ${{ secrets.INFISICAL_PUBLIC_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_PUBLIC_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PUBLIC_PROJECT_SLUG }}
          secret-path: /deploy
          env-slug: ${{ env.INFISICAL_ENV }}

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ env.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ env.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ env.DOKPLOY_COMPOSE_ID }}
        run: |
          curl --fail --silent --show-error -X POST \
            "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
