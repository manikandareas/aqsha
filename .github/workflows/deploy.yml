name: Deploy

# Push to main → gate (reuses CI) → build 3 images in parallel and push to GHCR → tell Dokploy to
# pull + restart. The VPS never builds; it only `docker pull`s finished images.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy mid-flight

# Default least privilege for every job; the build job widens it to `packages: write` below.
permissions:
  contents: read

jobs:
  # Same typecheck + lint + test gate as PRs. A red gate blocks build/deploy.
  # No `secrets: inherit`: the gate self-skips keyless external-service tests and only uses the
  # workflow-local DATABASE_URL/REDIS_URL, so it needs none of this repo's secrets.
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: agent, dockerfile: apps/agent/Dockerfile }
    steps:
      # Third-party actions pinned to immutable commit SHAs (see ci.yml). Trailing comment = version.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false # don't retain the GITHUB_TOKEN in .git/config after checkout

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the web build-time secrets (NEXT_PUBLIC_* + Sentry org/project/DSN/auth-token) from
      # Infisical /build and inject them as env vars (masked in logs) for the build step below. Only
      # the web image consumes them; api/agent ignore the extra build-args, so one step covers the
      # whole matrix. Bootstrap = the `gh-actions` machine identity (GH Secrets). env-slug `prod`.
      - name: Import build secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: https://secrets.aqshara.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /build

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aqsha-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image layer cache across runs (keyed by service so web/api/agent don't collide).
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Superset of build-args; a Dockerfile that doesn't declare an ARG just ignores it. NEXT_PUBLIC_*
          # + SENTRY_ORG/PROJECT come from Infisical /build (imported into env by the step above), baked
          # into the web bundle. GIT_COMMIT/CI are workflow-derived.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            CI=true
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ env.SENTRY_ORG }}
            SENTRY_PROJECT_WEB=${{ env.SENTRY_PROJECT_WEB }}
          # Auth token as a BuildKit secret (never in an image layer). From Infisical /build. Consumed
          # only by the web build; unset → Sentry source-map upload is skipped, build still succeeds.
          secrets: |
            sentry_auth_token=${{ env.SENTRY_AUTH_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Pull the Dokploy API creds from Infisical /deploy (masked in logs), injected as env vars.
      - name: Import deploy secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: https://secrets.aqshara.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /deploy

      # compose.yaml references :latest (IMAGE_TAG default), which build just repushed → Dokploy pulls
      # the fresh images and restarts the stack. Migrations stay manual (compose `migrate` profile).
      - name: Trigger Dokploy deploy
        # Secrets flow in as env vars (not interpolated into the shell line) so they never appear in
        # the rendered `run` script / process args and can't be shell-expanded.
        env:
          DOKPLOY_URL: ${{ env.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ env.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ env.DOKPLOY_COMPOSE_ID }}
        run: |
          curl --fail --silent --show-error -X POST \
            "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
