name: agent-evals

# Phase 3, Slice 3.3 — verification quality gate.
#   Job 1 (blocking): pure golden-set + contract evals (vitest/convex-test, no
#     external services), publishing precision/recall to the run summary.
#   Job 2 (non-blocking, secret-gated): push the schema to a Convex PREVIEW
#     deployment + seed builtin skills (validates schema/validators/seeding on a
#     real deployment). The full mocked deep-research smoke is deferred (Daytona
#     egress is blocked at this tier and provider mocking is brittle).

on:
  pull_request:
    paths:
      - "packages/convex/convex/agent/**"
      - "packages/convex/convex/sandbox/**"
      - "packages/convex/convex/schema.ts"
      - "packages/convex/skills/**"
      - "packages/convex/tests/**"
      - ".github/workflows/agent-evals.yml"
  schedule:
    - cron: "0 6 * * *" # nightly 06:00 UTC
  workflow_dispatch:

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run eval + contract suite
        env:
          EVAL_METRICS_FILE: ${{ github.workspace }}/eval-metrics.md
        run: bun run --filter '@aqsha/convex' test

      - name: Publish eval metrics
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/eval-metrics.md" ]; then
            {
              echo "### Agent verification evals"
              echo ""
              cat "${{ github.workspace }}/eval-metrics.md"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No eval metrics file produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  preview-integration:
    runs-on: ubuntu-latest
    # Only runs when a PREVIEW-scoped deploy key is configured. NEVER use a
    # production deploy key here — `convex deploy --preview-create` targets a
    # throwaway preview deployment, not production.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy schema to a Convex preview + seed builtin skills
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        working-directory: packages/convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          PREVIEW="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          # Bundles skills, validates schema/indexes/validators against a real
          # preview deployment (the runtime equivalent of `convex dev --once`).
          bunx convex deploy --preview-create "agent-evals-${PREVIEW}" --yes
          bunx convex run agent/skills/skills:seedBuiltinSkills '{}' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Mocked deep-research smoke (non-blocking, deferred)
        continue-on-error: true
        run: |
          echo "Mocked end-to-end deep-research smoke is deferred (provider mocking + Daytona egress)." >> "$GITHUB_STEP_SUMMARY"
