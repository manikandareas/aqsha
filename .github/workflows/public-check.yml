name: Public release check

on:
  pull_request:
    branches: [main, staging]
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aqsha_public
          POSTGRES_DB: aqsha_public
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqsha_public -d aqsha_public"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aqsha_public@localhost:5432/aqsha_public
      REDIS_URL: redis://localhost:6379
      PUBLIC_SITE_URL: https://aqshara.example
      PUBLIC_API_URL: https://api.aqshara.example
      PUBLIC_CORS_ORIGINS: https://aqshara.example
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Typecheck public dependencies
        run: |
          bun run --filter '@aqsha/db' typecheck
          bun run --filter '@aqsha/services' typecheck
          bun run --filter '@aqsha/api' typecheck
          bun run --filter '@aqsha/www' typecheck

      - name: Lint public API
        run: >-
          bunx eslint
          apps/api/src/public-app.ts
          apps/api/src/public-server.ts
          apps/api/src/routes/public-health.ts
          apps/api/src/routes/waitlist.ts
          apps/api/test/public-app.test.ts
          apps/api/test/waitlist.test.ts

      - name: Prepare public database
        run: bun run db:migrate:public

      - name: Test waitlist surface
        run: bun test apps/api/test/public-app.test.ts apps/api/test/waitlist.test.ts

      - name: Build public landing
        run: bun run --filter '@aqsha/www' build
