name: Release

# Manual, tag-driven. Push an annotated tag `vX.Y.Z` on main → verify the changelog is in sync, then
# publish a GitHub Release with auto-generated notes. This does NOT build or deploy: the push to `main`
# already shipped the images via deploy.yml. The tag/release only records the version. See VERSIONING.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Least privilege: only the release-publish scope.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Needed to read the changelog files for the sync check.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Enforce the release invariant (VERSIONING.md rule 1): a tag cannot ship without a changelog
      # entry whose frontmatter `version` matches the tag. Fixed-string grep so dots stay literal.
      - name: Verify changelog is in sync with the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -rlF "version: \"${version}\"" apps/web/content/changelog/ >/dev/null 2>&1; then
            echo "::error::No changelog entry with version \"${version}\" in apps/web/content/changelog/. Add one before tagging ${GITHUB_REF_NAME} (see VERSIONING.md)."
            exit 1
          fi
          echo "changelog entry for ${version} found — tag ↔ changelog in sync"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # --generate-notes builds the notes server-side from merged PRs since the previous tag.
        # --verify-tag guards against publishing a release for a non-existent tag.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
