name: Release

# Manual, tag-driven. Push an annotated tag `vX.Y.Z` on main → publish a GitHub Release with
# auto-generated notes. This does NOT build or deploy: the push to `main` already shipped the images
# via deploy.yml. The tag/release only records the version for humans. See VERSIONING.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Least privilege: only the release-publish scope.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # --generate-notes builds the notes server-side from merged PRs since the previous tag; no
        # checkout needed. --verify-tag guards against publishing a release for a non-existent tag.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
