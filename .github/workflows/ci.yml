name: CI

# Gate for pull requests into main: typecheck + lint + the full test suite (unit + itests).
# Also exposed as a reusable workflow (workflow_call) so deploy.yml runs the exact same gate
# before building images — one source of truth for "is this green".
on:
  pull_request:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel when called from a deploy (workflow_call on main) —
  # deploy.yml owns its own no-cancel concurrency and must not have its gate yanked mid-run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres (pgvector) + Redis back the integration tests. Tests that need them are guarded on
    # DATABASE_URL/REDIS_URL and self-skip otherwise; providing both here lights up the itests.
    # External-service tests (LLM/S3/research APIs) have no keys in CI and self-skip, exactly as on
    # a keyless dev machine running `bun test`.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aqsha
          POSTGRES_PASSWORD: aqsha
          POSTGRES_DB: aqsha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqsha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aqsha:aqsha@localhost:5432/aqsha
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fast fail on types/lint before the slower DB setup + tests.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Extensions come from init-extensions.sql (mounted in prod compose; run by hand here), then
      # apply all Drizzle migrations so the itests hit a real, current schema.
      - name: Prepare database
        run: |
          psql "$DATABASE_URL" -f infra/init-extensions.sql
          bun run db:migrate

      - name: Test
        run: bun run test
