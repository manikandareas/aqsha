name: statverify-snapshot

# Builds the Daytona statverify snapshot image (R + Python verification stack)
# and pushes it to GitHub Container Registry. Creating the Daytona snapshot FROM
# this image is a one-time Daytona-side step (see infra/statverify-snapshot/README.md).

on:
  push:
    branches: [main, development]
    paths:
      - "infra/statverify-snapshot/**"
      - ".github/workflows/statverify-snapshot.yml"
  workflow_dispatch:

concurrency:
  group: statverify-snapshot-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aqsha-statverify

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read snapshot version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < infra/statverify-snapshot/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: infra/statverify-snapshot
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "### statverify snapshot image pushed"
            echo ""
            echo "- \`${{ env.IMAGE }}:${{ steps.ver.outputs.version }}\`"
            echo "- \`${{ env.IMAGE }}:latest\`"
            echo "- \`${{ env.IMAGE }}:${{ github.sha }}\`"
            echo ""
            echo "**Next (one-time, Daytona side):**"
            echo '```bash'
            echo "daytona snapshot create aqsha-statverify-${{ steps.ver.outputs.version }} \\"
            echo "  --image ${{ env.IMAGE }}:${{ steps.ver.outputs.version }} \\"
            echo "  --cpu 1 --memory 2 --disk 4"
            echo '```'
            echo "Then set \`DAYTONA_STATVERIFY_SNAPSHOT=aqsha-statverify-${{ steps.ver.outputs.version }}\` on the Convex deployment."
            echo ""
            echo "> The GHCR package must be public, or add GHCR registry credentials in Daytona, for the pull to succeed."
          } >> "$GITHUB_STEP_SUMMARY"
